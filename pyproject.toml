[project]
name = "job-scanner"
version = "0.1.0"
description = "Hourly job-board scanner with filterable dashboard"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
  "mypy>=1.13",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
